name: Verify forms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so upstream drift surfaces here and not in a user project.
    - cron: "0 6 * * 1"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modular-features:
    name: modular-features (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./modular-features --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "base_package=com.verify.app"
          chmod +x "$RUNNER_TEMP/out/gradlew"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble rendered output
        working-directory: ${{ runner.temp }}/out
        # Flavor dimensions mean assembleDebug already aggregates every
        # environment's debug variant (developmentDebug, stagingDebug,
        # productionDebug) — no matrix needed to cover the three of them.
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Each flavor's BuildConfig reports its own environment (ADR-0018)
        working-directory: ${{ runner.temp }}/out
        run: |
          for env in development staging production; do
            files=$(find app/build -iname "BuildConfig.java" -ipath "*${env}*")
            if [ -z "$files" ]; then
              echo "::error::no generated BuildConfig under a path containing \"$env\""; exit 1
            fi
            match=0
            for f in $files; do
              grep -q "ENVIRONMENT = \"$env\"" "$f" && match=1
            done
            if [ "$match" -ne 1 ]; then
              echo "::error::none of the generated BuildConfig files for \"$env\" report ENVIRONMENT = \"$env\""; exit 1
            fi
          done

  single-module:
    name: single-module (${{ matrix.combo.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { name: default, args: "" }
          - { name: min-sdk-24, args: --set min_sdk=24 }
    steps:
      - uses: actions/checkout@v4
      - uses: Templetry/.github/actions/setup-templetry@main
      - name: Render
        run: |
          templetry render --template ./single-module --out "$RUNNER_TEMP/out" \
            --set "project_name=Verify App" --set "base_package=com.verify.app" ${{ matrix.combo.args }}
          chmod +x "$RUNNER_TEMP/out/gradlew"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble rendered output
        working-directory: ${{ runner.temp }}/out
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Each flavor's BuildConfig reports its own environment (ADR-0018)
        working-directory: ${{ runner.temp }}/out
        run: |
          for env in development staging production; do
            files=$(find app/build -iname "BuildConfig.java" -ipath "*${env}*")
            if [ -z "$files" ]; then
              echo "::error::no generated BuildConfig under a path containing \"$env\""; exit 1
            fi
            match=0
            for f in $files; do
              grep -q "ENVIRONMENT = \"$env\"" "$f" && match=1
            done
            if [ "$match" -ne 1 ]; then
              echo "::error::none of the generated BuildConfig files for \"$env\" report ENVIRONMENT = \"$env\""; exit 1
            fi
          done
